<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>numerical.run</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=__V__">
  <link rel="stylesheet" href="./style.css?v=__V__">
  <script>window.NUMCFG = { runtime: '__RUNTIME__', figrender: '__FIGRENDER__', monaco: '__MONACO__' };</script>
  <style>
    html, body { height: 100%; margin: 0; }
    [hidden] { display: none !important; }
    body { display: flex; flex-direction: column; background: var(--bg); color: var(--ink); }
    header { display: flex; align-items: center; gap: 0.5rem 0.85rem; padding: 0.55rem 1rem; border-bottom: 1px solid var(--edge); background: var(--panel); flex: none; flex-wrap: wrap; position: relative; }
    header::after { content:""; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:var(--grad); opacity:.9; }
    .wordmark { font-weight: 600; display: inline-flex; align-items: center; gap: .45rem; text-decoration: none; color: var(--ink); }
    /* thumbnails in a gallery/prose notebook — modest, and smaller on phones */
    #pv-app .nr-text img, .nbc .md-view img { width: 100%; max-width: min(300px, 62vw); height: auto; border: 1px solid var(--edge); border-radius: 10px; display: block; margin: .5rem 0; }
    #pv-app .nr-text a:has(img) { display: inline-block; }
    .wordmark .logo { height: 1.45em; width: auto; display: block; }
    .wordmark b { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 800; }
    .tag { font-size: 0.72rem; color: var(--muted); }
    header .spacer { flex: 1; }
    button, select { font: inherit; }
    #run-btn { background: var(--grad); color: var(--accent-ink); border: none; font-weight: 600; padding: 0.3rem 0.85rem; border-radius: 7px; cursor: pointer; }
    #run-btn:hover { filter: brightness(1.07); }
    .kbd { font: 11px ui-monospace, Menlo, monospace; color: var(--accent-ink); opacity: .8; margin-left: 0.35rem; }
    button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--edge); border-radius: 7px; padding: 0.3rem 0.7rem; font-size: 0.82rem; cursor: pointer; }
    button.ghost:hover { color: var(--ink); border-color: var(--accent); }
    /* share stands out: a blue→purple gradient contour (fills on hover) */
    #share-btn { border: 1.6px solid transparent; border-radius: 8px; font-weight: 600; color: var(--ink);
      background: linear-gradient(var(--bg), var(--bg)) padding-box, var(--grad) border-box; }
    #share-btn:hover { background: var(--grad); color: var(--accent-ink); }
    select { background: var(--panel); color: var(--ink); border: 1px solid var(--edge); border-radius: 7px; padding: 0.28rem 0.5rem; font-size: 0.82rem; }
    /* Notebook | App toggle — selected mode carries the blue→purple gradient */
    .seg { display: inline-flex; border: 1px solid var(--edge); border-radius: 8px; overflow: hidden; }
    .seg button { border: none; background: var(--panel); padding: 0.32rem 0.85rem; font-size: 0.82rem; cursor: pointer; color: var(--muted); transition: background .15s, color .15s; }
    .seg button + button { border-left: 1px solid var(--edge); }
    .seg button.on { background: var(--grad); color: var(--accent-ink); font-weight: 600; }

    /* share: gradient firework + temporary link toast */
    #share-btn.pop { animation: share-pop .3s ease; }
    @keyframes share-pop { 0%{transform:scale(1);} 40%{transform:scale(.9);} 100%{transform:scale(1);} }
    .fx-layer { position: fixed; inset: 0; pointer-events: none; z-index: 1000; }
    .fx { position: fixed; width: 9px; height: 9px; border-radius: 2px; transform: translate(-50%,-50%); opacity: 0; box-shadow: 0 0 6px rgba(139,124,255,.6); animation: fx-burst 950ms cubic-bezier(.15,.7,.3,1) forwards; }
    @keyframes fx-burst {
      0% { transform: translate(-50%,-50%) scale(.5) rotate(0deg); opacity: 1; }
      70% { opacity: 1; }
      100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy) + 26px)) scale(1) rotate(260deg); opacity: 0; }
    }
    #link-toast { position: fixed; left: 50%; top: .9rem; transform: translate(-50%,-24px); z-index: 1001;
      display: flex; align-items: center; gap: .5rem; max-width: min(92vw, 560px);
      padding: .5rem .85rem; border-radius: 999px; background: var(--bg); border: 1px solid var(--edge);
      box-shadow: 0 10px 34px rgba(0,0,0,.20); opacity: 0; pointer-events: none;
      transition: opacity .28s ease, transform .28s ease; }
    #link-toast.show { opacity: 1; transform: translate(-50%, 0); }
    #link-toast .lt-txt { font: 12px ui-monospace, Menlo, monospace; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #link-toast .lt-tag { background: var(--grad); color: var(--accent-ink); font-weight: 600; border-radius: 999px; padding: .08rem .55rem; font-size: .7rem; white-space: nowrap; }

    main { display: flex; flex: 1; min-height: 0; padding: 0; justify-content: flex-start; }
    .pane { display: flex; flex-direction: column; min-width: 0; }
    #editor-pane { flex: 1; border-right: 1px solid var(--edge); padding: 0; }
    .right { width: 46%; min-width: 300px; }
    .panehead { display: flex; align-items: center; gap: 0.45rem; padding: 0.35rem 0.7rem; border-bottom: 1px solid var(--edge); background: var(--panel); font-size: 0.72rem; color: var(--muted); }
    #editor { flex: 1; min-height: 0; }
    .preview { flex: 1; min-height: 0; overflow: auto; background: var(--bg); }
    #pv-app { padding: 1.4rem 1.2rem 3rem; max-width: 46rem; margin: 0 auto; }
    /* full-width bottom bar (a body child, not inside the flex-row #stage — else
       it lays out as a column to the RIGHT of the content) */
    .statusbar { flex: none; display: flex; gap: 1rem; align-items: center; padding: 0.35rem 0.9rem; border-top: 1px solid var(--edge); background: var(--panel); font: 11.5px ui-monospace, Menlo, monospace; color: var(--muted); }
    .statusbar .spacer { flex: 1; }
    #stage.view ~ .statusbar { display: none; }   /* no dev status bar for plain App viewers */

    /* ---- layout by stage state ---- */
    /* view: full-width app; no editor */
    #stage.view #editor-pane, #stage.view #cells { display: none; }
    #stage.view .right { width: auto; flex: 1; }
    #stage.view .panehead { display: none; }
    /* edit + classic: monaco blob (left) + app preview (right) */
    #stage.classic #cells { display: none; }
    /* edit + notebook: full-width editable cells */
    #stage.notebook #editor-pane, #stage.notebook .right { display: none; }
    #stage.notebook #cells { display: block; }

    #cells { max-width: 60rem; margin: 0 auto; width: 100%; padding: 1.2rem 1rem 4rem; overflow: auto; }
    .nbc { border: 1px solid var(--edge); border-radius: 10px; margin: 0.7rem 0; overflow: hidden; background: var(--bg); }
    .nbc.markdown { border-style: dashed; }
    .nbc-head { display: flex; align-items: center; gap: .4rem; padding: .2rem .5rem; background: var(--panel); border-bottom: 1px solid var(--edge); }
    .nbc.markdown .nbc-head { border-bottom: none; }
    .nbc-badge { font-size: .6rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); border: 1px solid var(--edge); border-radius: 5px; padding: .03rem .35rem; }
    .nbc-btn { color: var(--accent); font-weight: 600; font-size: .72rem; background: transparent; border: 1px solid var(--edge); border-radius: 6px; padding: .08rem .45rem; cursor: pointer; }
    .nbc-btn:hover { background: var(--grad); color: var(--accent-ink); border-color: transparent; }
    .nbc .cell-out { padding: .2rem .7rem .5rem; } .nbc .cell-out:empty { display: none; }
    .nbc .md-view { padding: .55rem .8rem; } .nbc .md-view > :first-child { margin-top: .2rem; }
    /* insert-anywhere control: a subtle always-visible "+" on every gap (top,
       between each pair, bottom) that expands to Code/Text on tap. Always
       visible so it works on touch (no hover dependency). */
    .nb-ins { display:flex; align-items:center; justify-content:center; min-height:22px; position:relative; max-width:60rem; margin:0 auto; }
    .nb-ins::before { content:""; position:absolute; left:1rem; right:1rem; top:50%; height:1px; background:var(--edge); opacity:.5; }
    .nb-ins .plus { position:relative; z-index:1; width:24px; height:24px; border-radius:50%; border:1px solid var(--edge); background:var(--bg); color:var(--muted); font-size:16px; line-height:20px; padding:0; cursor:pointer; opacity:.5; }
    .nb-ins:hover .plus, .nb-ins .plus:focus { opacity:1; border-color:var(--accent); color:var(--accent); }
    @media (hover: none) { .nb-ins .plus { opacity:.7; } }
    .nb-ins .choice { position:relative; z-index:1; display:flex; gap:.4rem; background:var(--bg); padding:0 .4rem; }
    .nb-ins .choice button { font-size:.72rem; color:var(--accent); background:var(--bg); border:1px solid var(--edge); border-radius:6px; padding:.15rem .55rem; cursor:pointer; }
    .nb-ins .choice button:hover { background:var(--grad); color:var(--accent-ink); border-color:transparent; }
    /* widget submenu inside the "+" */
    .nb-ins .wchoice { position:relative; z-index:2; display:flex; flex-wrap:wrap; gap:.3rem; justify-content:center; background:var(--bg); border:1px solid var(--edge); border-radius:10px; padding:.4rem; max-width:min(92vw,30rem); box-shadow:0 8px 26px rgba(0,0,0,.16); }
    .nb-ins .wchoice button { font-size:.72rem; color:var(--ink); background:var(--panel); border:1px solid var(--edge); border-radius:6px; padding:.2rem .5rem; cursor:pointer; }
    .nb-ins .wchoice button:hover { background:var(--grad); color:var(--accent-ink); border-color:transparent; }

    body.is-edit .edit-only { display: inline-flex; }
    .edit-only { display: none; }
    body.is-edit .view-only { display: none; }


    @media (max-width: 860px) {
      #stage.classic { flex-direction: column; }
      #stage.classic #editor-pane, #stage.classic .right { width: auto; flex: none; }
      #stage.classic #editor-pane { border-right: none; border-bottom: 1px solid var(--edge); }
      body.is-edit.has-classic, body.is-edit.has-classic html { }
      #stage.classic #editor { height: 55vh; min-height: 260px; flex: none; }
      #stage.classic .preview { height: auto; overflow: visible; }
      html:has(#stage.classic), body:has(#stage.classic) { height: auto; overflow: visible; }
      header .tag { display: none; }
    }
  </style>
</head>
<body data-v="__V__">
  <header>
    <a class="wordmark" href="./" title="Home — all demos"><svg class="logo" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="nrg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset=".5" stop-color="#6d5cf6"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs><rect x="1" y="1" width="30" height="30" rx="8" fill="url(#nrg)"/><g fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 8.5 H8 V23.5 H11"/><path d="M21 8.5 H24 V23.5 H21"/></g><path d="M13.4 11 V21 L20 16 Z" fill="#fff"/></svg><span>numerical<b>.run</b></span></a>
    <span class="spacer"></span>
    <div class="seg" id="nav-seg">
      <button data-nav="edit" id="nav-edit">Notebook</button>
      <button data-nav="app" id="nav-app">App</button>
    </div>
    <button id="run-btn" hidden>▶ Run<span class="kbd">⌘⏎</span></button>
    <button id="share-btn" class="ghost" title="Copy a link carrying this document">share</button>
  </header>

  <main id="stage" class="view">
    <section class="pane" id="editor-pane">
      <div class="panehead">editor · <span style="color:var(--accent)">.nb.md</span> — Run to render</div>
      <div id="editor"></div>
    </section>
    <div id="cells"></div>
    <section class="pane right">
      <div class="preview"><div id="pv-app"><div class="tag" style="padding:2rem 1rem">loading the RunMat&nbsp;0.6.1 runtime (52&nbsp;MB, cached after first visit)…</div></div></div>
    </section>
  </main>
  <div class="statusbar" id="statusbar"><span id="status2"></span><span class="spacer"></span><span id="dev-time"></span></div>

  <script type="module" src="./app.js?v=__V__"></script>
</body>
</html>
